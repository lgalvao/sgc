<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{fragments/layout}" lang="pt">

<head>
    <title>Dashboard - SGC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 data-testid="dashboard-title">Dashboard</h2>
        <a th:href="@{/processo/novo}"
           class="btn btn-primary"
           sec:authorize="hasRole('SEDOC')"
           data-testid="novo-processo-btn">
            <i class="fas fa-plus"></i> Novo processo de mapeamento
        </a>
    </div>

    <div class="card mb-4">
        <div class="card-header">
            <h5 class="card-title mb-0">Processos em andamento</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Data limite</th>
                        <th>Unidades participantes</th>
                        <th>Progresso</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!--/*@thymesVar id="processo" type="List<Processo>"*/-->
                    <tr th:if="${#lists.isEmpty(processos)}">
                        <td colspan="5" class="text-center">Nenhum processo em andamento</td>
                    </tr>
                    <tr th:each="processo : ${processos}"
                        style="cursor: pointer; transition: background-color 0.2s;"
                        th:onclick="'window.location.href=\'' + @{/processo/{id}(id=${processo.id})} + '\''"
                        onmouseover="this.style.backgroundColor='#0d6efd'"
                        onmouseout="this.style.backgroundColor=''"
                        class="clickable-row">
                        <td th:text="${processo.nome}"></td>
                        <td th:text="${#temporals.format(processo.dataLimite, 'dd/MM/yyyy')}"></td>
                        <td th:text="${processo.totalUnidades}"></td>
                        <td>
                            <div class="progress">
                                <div class="progress-bar" role="progressbar"
                                     th:style="'width: ' + ${processo.percentualConclusao} + '%'"
                                     th:text="${processo.percentualConclusao} + '%'">
                                </div>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Estatísticas -->
    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">Total de Processos</h6>
                    <h2 class="card-title" th:text="${totalProcessos}" data-testid="total-processos">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">Unidades Ativas</h6>
                    <h2 class="card-title" th:text="${unidadesAtivas}" data-testid="unidades-ativas">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">Processos Finalizados</h6>
                    <h2 class="card-title" th:text="${processosFinalizados}" data-testid="processos-finalizados">0</h2>
                </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>
