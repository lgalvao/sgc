<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>Processos de mapeamento - SGC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script th:src="@{/js/processos.js}" defer=""></script>
</head>

<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Processos de mapeamento</h2>
        <a th:href="@{/processo/novo}" class="btn btn-primary" sec:authorize="hasRole('SEDOC')">
            <i class="fas fa-plus"></i> Novo Processo
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Data limite</th>
                        <th>Situação</th>
                        <th>Unidades participantes</th>
                        <th>Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(processos)}">
                        <td colspan="5" class="text-center">Nenhum processo encontrado</td>
                    </tr>
                    <tr th:each="processo : ${processos}">
                        <td th:text="${processo.nome}"></td>
                        <td th:text="${#temporals.format(processo.dataLimite, 'dd/MM/yyyy')}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${processo.situacao == 'EM_ANDAMENTO' ? 'bg-primary' : (processo.situacao == 'FINALIZADO' ? 'bg-success' : 'bg-secondary')}"
                                  th:text="${processo.situacao}">
                            </span>
                        </td>
                        <td th:text="${processo.totalUnidades}"></td>
                        <td>
                            <a th:href="@{/processo/{id}(id=${processo.id})}" class="btn btn-sm btn-info">
                                <i class="fas fa-eye"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>

</html>
