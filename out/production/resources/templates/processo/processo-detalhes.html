<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}"
      lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>Detalhes do Processo - SGC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 data-testid="detalhes-processo-title">Detalhes do Processo</h2>
        <a th:href="@{/}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>
    </div>

    <div class="row">
        <!-- Informações do Processo -->
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="card-title mb-0" data-testid="info-processo-title">Informações do Processo</h5>
                </div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-4">Nome:</dt>
                        <dd class="col-sm-8" th:text="${processo.nome}"></dd>

                        <dt class="col-sm-4">Data limite:</dt>
                        <dd class="col-sm-8"
                            th:text="${#temporals.format(processo.dataLimite, 'dd/MM/yyyy')}"></dd>

                        <dt class="col-sm-4">Situação:</dt>
                        <dd class="col-sm-8">
                                <span class="badge"
                                      th:classappend="${processo.situacao == 'EM_ANDAMENTO' ? 'bg-primary' : (processo.situacao == 'FINALIZADO' ? 'bg-success' : 'bg-secondary')}"
                                      th:text="${processo.situacao}">
                                </span>
                        </dd>
                    </dl>
                </div>
            </div>
        </div>

        <!-- Estatísticas -->
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="card-title mb-0" data-testid="estatisticas-processo-title">Estatísticas</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-6 mb-3">
                            <h6 class="text-muted">Total de Unidades</h6>
                            <h3 th:text="${processo.totalUnidades}">0</h3>
                        </div>
                        <div class="col-6 mb-3">
                            <h6 class="text-muted">Progresso</h6>
                            <div class="progress">
                                <div class="progress-bar" role="progressbar"
                                     th:style="'width: ' + ${processo.percentualConclusao} + '%'"
                                     th:text="${processo.percentualConclusao} + '%'">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Unidades -->
    <div class="card">
        <div class="card-header">
            <h5 class="card-title mb-0" data-testid="unidades-processo-title">Unidades</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Unidade</th>
                        <th>Responsável</th>
                        <th>Situação</th>
                        <th>Última Atualização</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${processo.processosUnidades == null || #lists.isEmpty(processo.processosUnidades)}">
                        <td colspan="5" class="text-center">Nenhuma processoUnidade participante</td>
                    </tr>
                    <tr th:each="processoUnidade : ${processo.processosUnidades}"
                        style="cursor: pointer; transition: background-color 0.2s;"
                        th:onclick="'window.location.href=\'' + @{/processo-unidade/{processoUnidadeId}/atividades(processoUnidadeId=${processoUnidade.id})} + '\''"
                        onmouseover="this.style.backgroundColor='#0d6efd'"
                        onmouseout="this.style.backgroundColor=''"
                        class="clickable-row">
                        <td th:text="${processoUnidade.unidadeNome}"></td>
                        <td th:text="${processoUnidade.responsavelNome}"></td>
                        <td><span
                                th:class="'badge ' + (${processoUnidade.situacao == 'FINALIZADA' ? 'bg-success' : (processoUnidade.situacao == 'EM_ANDAMENTO' ? 'bg-primary' : 'bg-secondary')})"
                                th:text="${processoUnidade.situacao}">
                        </span>
                        </td>
                        <td th:if="${processoUnidade.ultimaAtualizacao != null}"
                            th:text="${#temporals.format(processoUnidade.ultimaAtualizacao, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:unless="${processoUnidade.ultimaAtualizacao != null}">-</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>

</html>
