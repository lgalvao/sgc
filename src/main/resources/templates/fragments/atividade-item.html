<!-- Fragmento Thymeleaf para um item de atividade -->
<div class="atividade-item card mb-4" th:fragment="atividadeItem(atividade, index)">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span>Atividade <span th:text="${index + 1}"></span></span>
        <button type="button" class="btn btn-sm btn-danger btn-remove-atividade">
            <i class="fas fa-trash"></i> Remover
        </button>
    </div>
    <div class="card-body">
        <input type="hidden" th:name="|atividades[${index}].id|" value=""/>
        <div class="mb-3">
            <label for="descricaoAtividade" th:for="|descricao${index}|" class="form-label">
                Descrição da Atividade <span class="text-danger">*</span>
            </label>
            <input id="descricaoAtividade" type="text" class="form-control" th:name="|atividades[${index}].descricao|"
                   th:id="|descricao${index}|" th:value="|${atividade.descricao}|" required
                   maxlength="255" placeholder="Descreva a atividade"
                   th:attr="data-testid=|atividade-descricao-${index}|" />
            <div class="invalid-feedback">
                A descrição da atividade é obrigatória.
            </div>
        </div>
        <div class="conhecimentos-container mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <label class="form-label">Conhecimentos <span class="text-danger">*</span></label>
                <button type="button" class="btn btn-sm btn-outline-primary btn-add-conhecimento"
                        th:attr="data-testid=|novo-conhecimento-${index}|">
                    <i class="fas fa-plus"></i> Adicionar Conhecimento
                </button>
            </div>
            <div th:each="conhecimento, kStat : ${atividade.conhecimentos}">
                <div th:replace="fragments/conhecimento-item :: conhecimentoItem(${index}, ${kStat.index}, ${conhecimento})"></div>
            </div>
        </div>
    </div>
</div>
